name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy + test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Desktop is unsupported: the facade only builds on the host with `server`.
      # The examples are app binaries for web/mobile and are checked per target below.
      - run: >
          cargo clippy --workspace --exclude connect-demo --exclude mobile-demo
          --all-targets --features dioxus-solana/server --locked -- -D warnings
      - run: >
          cargo test --workspace --exclude connect-demo --exclude mobile-demo
          --features dioxus-solana/server --locked
      - name: desktop build is rejected
        run: |
          if cargo check -p dioxus-solana --locked 2> err.log; then
            echo "dioxus-solana compiled for desktop without the server feature"; exit 1
          fi
          grep -q "desktop is not supported" err.log

  wasm:
    name: clippy + build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (wasm)
        run: >
          cargo clippy --locked --target wasm32-unknown-unknown --all-targets
          -p dioxus-solana -p dioxus-solana-web -p connect-demo -p mobile-demo
          -- -D warnings
      - name: build (wasm)
        run: >
          cargo build --locked --target wasm32-unknown-unknown
          -p dioxus-solana -p dioxus-solana-web -p connect-demo -p mobile-demo

  android:
    name: clippy (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (android)
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo clippy --locked --target aarch64-linux-android --all-targets \
            -p dioxus-solana -p mobile-demo -- -D warnings

  ios:
    name: clippy (ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo clippy --locked --target aarch64-apple-ios --all-targets
          -p dioxus-solana -p mobile-demo -- -D warnings
