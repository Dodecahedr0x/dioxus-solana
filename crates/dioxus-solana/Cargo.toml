[package]
name = "dioxus-solana"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Solana wallet connection, signing, and reactive RPC hooks for Dioxus web apps."
readme = "../../README.md"
keywords = ["solana", "dioxus", "wallet", "web3", "wasm"]
categories = ["wasm", "web-programming", "gui"]

[dependencies]
dioxus-solana-core.workspace = true
dioxus.workspace = true
solana-pubkey.workspace = true
solana-transaction.workspace = true
solana-signature.workspace = true
futures-util = "0.3"
serde = "1"
base64 = "0.22"

# Browser Wallet Standard + spume RPC. Host/Android must not pull this crate
# (spume splits wincode 0.5/0.6 on native).
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-solana-web.workspace = true
web-sys = { workspace = true, features = ["Window", "Storage"] }

[target.'cfg(target_os = "android")'.dependencies]
async-trait.workspace = true
futures-channel = "0.3"
jni = "0.21"
manganis = "=0.7.10"

[dev-dependencies]
wasm-bindgen-test = "0.3"
