[package]
name = "dioxus-solana"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Solana wallet connection, signing, and reactive RPC hooks for Dioxus web, Android and iOS apps."
readme = "../../README.md"
keywords = ["solana", "dioxus", "wallet", "wasm", "mobile"]
categories = ["wasm", "web-programming", "gui"]

[dependencies]
dioxus-solana-core.workspace = true
dioxus.workspace = true
solana-pubkey.workspace = true
solana-transaction.workspace = true
solana-signature.workspace = true
solana-hash = "4"
solana-instruction = "3"
solana-message = "4"
thiserror.workspace = true
futures-util = "0.3"
serde = "1"
serde_json = "1"
base64 = "0.22"
# RPC request/response types shared by every platform's transport.
solana-rpc-client-types = "4.1"
solana-account-decoder-client-types = "4.1"
solana-transaction-status-client-types = "4.1"
solana-epoch-info = { version = "3.1", features = ["serde"] }
solana-epoch-schedule = { version = "3.2", features = ["serde"] }

[features]
default = []
# Allow compiling on desktop/server targets, e.g. the server half of a
# fullstack web app. Wallets are unavailable there (no registry); RPC works.
# Desktop apps are not supported and fail to compile without this.
server = []

[package.metadata.docs.rs]
features = ["server"]

# Browser Wallet Standard + spume RPC. Host/Android must not pull this crate
# (spume splits wincode 0.5/0.6 on native).
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-solana-web.workspace = true
web-sys = { workspace = true, features = ["Window", "Storage"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bs58 = "0.5"
crypto_box = "0.9"
futures-channel = "0.3"
solana-rpc-client = { workspace = true }
solana-rpc-client-api = "4.1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-tungstenite = { version = "0.28", features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
async-trait.workspace = true
manganis = "=0.7.10"

[target.'cfg(target_os = "ios")'.dependencies]
async-trait.workspace = true
manganis = "=0.7.10"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
