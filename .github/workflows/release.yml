name: Release

# Publishes the library crates to crates.io when a GitHub Release is published.
# Bump the crate versions (and the internal dep versions in the root Cargo.toml)
# before tagging — crates.io rejects a version that already exists.
#
# Requires a `CARGO_REGISTRY_TOKEN` repository secret (crates.io API token).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Verify against the committed Cargo.lock, which pins the solana crates to
      # their wincode-0.5 releases. `cargo publish`'s own verification does a
      # fresh resolve that would pick the incompatible wincode-0.6 versions, so
      # we verify here and publish with --no-verify below.
      - name: Verify build (locked)
        run: cargo build --workspace --locked

      - name: Publish crates (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: skip a crate whose version is already on crates.io, so a
          # re-run finishes a partially-published release instead of aborting.
          publish() {
            echo "::group::publish $1"
            local out
            if out=$(cargo publish -p "$1" --locked --no-verify 2>&1); then
              echo "$out"
            elif grep -qiE "already (uploaded|exists)" <<<"$out"; then
              echo "$out"
              echo "→ $1 already published at this version; skipping"
            else
              echo "$out"; echo "::endgroup::"; return 1
            fi
            echo "::endgroup::"
          }
          publish dioxus-solana-core
          sleep 25   # let the new version land in the index before dependents
          publish dioxus-solana-web
          sleep 25
          publish dioxus-solana
